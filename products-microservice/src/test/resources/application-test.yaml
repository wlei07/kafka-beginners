app:
  # The embedded test cluster has only 1 broker (see the comment on @EmbeddedKafka in AbstractKafkaTest),
  # so a topic cannot have more than 1 replica. TODO: change back to 3 / 2 once the Kafka bug is fixed.
  topic-replicas: 1
  topic-min-insync-replicas: 1
spring:
  kafka:
    producer:
      properties:
        # "mock://" = in-memory Schema Registry inside the test JVM, so tests don't need the real one on :8081.
        # Producer and test consumer use the same name, so they share the same registry.
        schema.registry.url: mock://products-microservice-test
    consumer:
      group-id: product-created-events
      auto-offset-reset: earliest
